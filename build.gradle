plugins {
	id 'java'
	id 'application'
	id("com.gradleup.shadow") version "9.3.0"
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

application {
	mainClass = 'mdt.cli.MDTCommandsMain'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(":utils")
	implementation project(":mdt-client")
	
	// @Nullable
	compileOnly libs.jetbrains.annotations
	// @GuardedBy
	compileOnly libs.findbugs.jsr305

	// Lombok (from the project :utils)
	compileOnly libs.lombok
	annotationProcessor libs.lombok

	// logback with SLF4j (from the project :utils)
	implementation libs.logback.classic
	
	// HTTP Client
	implementation libs.okhttp
		
	// picocli command line parser
	implementation libs.picocli
	annotationProcessor libs.picocli.codegen
	implementation libs.jline
	
	// CLI에서 테이블 형태로 text 출력할 때 사용
	implementation libs.text.table.formatter
	// CLI에서 트리 형태로 text 출력할 때 사용
	implementation libs.text.tree
	
	// Tika
	implementation libs.tika.core

	// test (JUnit 5 / Jupiter)
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	// 의존 프로젝트의 logback-test.xml / logback-spring.xml은 jar에 포함하지 않는다.
	// (이 프로젝트의 logback.xml은 그대로 포함된다.)
	exclude 'logback-test.xml'
	exclude 'logback-spring.xml'
}

shadowJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	mergeServiceFiles()

	manifest {
		attributes 'Main-Class': application.mainClass.get(),
					// 'mdt -V'가 출력하는 버전 (MDTVersionProvider 참조)
					'Implementation-Version': project.version
	}

	exclude 'logback-test.xml'
	exclude 'logback-spring.xml'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}

eclipse {
	classpath {
		file {
			beforeMerged { cp ->
				cp.entries.removeAll { entry ->
					entry.kind == 'src' && entry.path in ['src/main/resources', 'src/test/resources']
				}
			}
			whenMerged { cp ->
				def entryGroups = cp.entries.groupBy { entry -> "${entry.kind}:${entry.path}" }
				entryGroups.each { _, entries ->
					if (entries.size() > 1) {
						def entry = entries.first()
						int index = cp.entries.indexOf(entry)
						cp.entries.removeAll(entries)
						cp.entries.add(index, entry)
					}
				}

				def linkedProjectBuildLibDirs = []
				if (cp.entries.any { it.kind == 'src' && it.path == '/mdt-client' }) {
					linkedProjectBuildLibDirs << project(':mdt-client').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				if (cp.entries.any { it.kind == 'src' && it.path == '/utils' }) {
					linkedProjectBuildLibDirs << project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}